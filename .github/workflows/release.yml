# Publishes to npm when a v* tag is pushed, via npm Trusted Publishing (OIDC):
# no token is stored. Configured once on npmjs.com -> commit-quiz -> Settings ->
# Trusted Publisher -> GitHub Actions (Cristopheer96/commit-quiz, release.yml).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: node --check bin/commit-quiz.mjs
      # The tag must match package.json, or npm publishes the wrong version.
      - run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json, commit, and re-tag."
            exit 1
          fi
      - run: npm publish --provenance --access public
